<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Informe número::"));
        let saida = "";
        for (let i = 1; i <=10; i = i + 1) {
            let resultado = n * i;

            saida = saida + n  + " X " + i +  " = " + resultado + "\n";
        }
        alert(saida);
    </script>
</body>
</html>

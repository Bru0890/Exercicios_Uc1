<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Ler cinco números e exibir a soma
        //Utilizando while

        let soma = 0;
        let c = 1;
        while (c <= 5) {
            let n = parseInt(prompt("Informe o número"));
            soma = soma + n;
            document.write(c + "</br>");
            c = c + 1;
        }
        alert("A soma é: " + soma);
    </script>
</body>
</html>

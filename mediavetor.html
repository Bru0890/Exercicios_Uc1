<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*Faça uma página onde terá um formulário que terá um campo de texto que será o nome do aluno,
        e DOIS campos que aceitaram apenas números que serão as notas dos alunos. Ao clicar no botão
        "Gravar", as informações serão armazenadas em um vetor.

        Na listagem das informações, além do nome, nota1 e nota2 também deverão ser impressas a média e a situação do aluno informando
        "Aprovado" se a média for maior que ou a igual a 7, caso contrário informará "Reprovado".

        No fim, esse arquivo deverá estar no seu repositório do Github*/

        let alunos = [];

        function cadastrar () {

            let aluno = document.getElementById("aluno").value;
            let nota1 = parseInt(document.getElementById("nota1").value);
            let nota2 = parseFloat(document.getElementById("nota2").value);

            let media = calcularmedia(nota1, nota2);
            let sit = situacao(media);
            alunos.push([aluno, nota1, nota2]);   
            let result = document.getElementById("resultado");
            result.innerHTML = saida();

            document.getElementById("aluno").value="";
            document.getElementById("nota1").value="";
            document.getElementById("nota2").value="";
            
        }

        function calcularmedia (n1, n2) {
           let media = (n1 + n2) / 2;
                alert("A média é " + media);

    }

        function situacao(media) {
            if (media >= 7){
            return "Aprovado";
    
             } else{
            return "Reprovado";
             }
      }

      function saida () {

        let retorno = "";
        for (let x=0; x < alunos.length; x = x + 1){
                for (let y=0; y < alunos[x].length;  y = y + 1) {
                    retorno += alunos[x][y] + "     ";

                }

                retorno += "</br>";
        }
        
        return retorno;

    }

    </script>
    </head>
    <form>
        <input type="text" id="aluno"
        placeholder="Nome do Aluno" />
        <input type='number' id='nota1'
        placeholder="Nota 1" />
        <input type='number' id='nota2'
        placeholder="Nota2" step=".01" />
        <input type='button' value="Gravar"
        onclick="cadastrar()" />

        <div id='resultado'></div>
    </form>
</body>
</html>

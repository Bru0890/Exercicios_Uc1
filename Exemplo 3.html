<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //ler dois números e exibir a soma
        var numero1 = prompt("Informe o primeiro número");
        var numero2 = prompt("Informe o segundo número");
        var soma = parseInt(numero1) + parseInt (numero2);
        //soma = parseFloat(número1) parseFloat(número2)
        /*
        + adição
        - Subtração
        *Multiplicação
        / Dvissão
        */
        //use parsEfloat para converter para float
        //float são números "quebrados"
        alert("A soma é: " + soma);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let altura = parseFloat(prompt("Informe a altura "));
        let sexo = prompt(" Informe o sexo");

        if (sexo == "M") {
            let peso = (72.7 * altura) - 58;
            alert ("O peso ideal é " + peso);

        } else if (sexo== "F") {
            let peso = (62.1 * altura) - 44.7;
            alert ("O peso ideal é " + peso);
            
        } else {
            alert("Informação Inválida");
        
        }
        

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        //Faça um programa que converta uma temperatura em Celsius para Fahrenheit utiliando a fórmula abaixo:
        //F = 9C / 5 + 32

        //Entrada
        var temperatura = prompt("Digite a temperatura em Celsius: ");
        var Fahrenheit = 9*temperatura / 5 + 32

        //Saída
        alert("A temperatura em Fahrenheit é: " + Fahrenheit);
        
    </script>
</body>
</html>

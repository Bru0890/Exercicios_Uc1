<script>
    let idade = parseInt(prompt("Informe idade: "));
    let maior = idade >= 18;
    // > ">=" e "<=" mão se separa

    /* = (Atribuição, uma variável eceber um valor)
    == (Comparação dos valore)
    === (Comparar o valor e o tipo)
    != (Diferente)
    */
   if(idade >= 18) {
    alert("Você é maior de idade");
   } else {
    alert("Você é MENOR de idade");
   } 
   
   //alert(maior);

</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Faça um programa que realiza a leitura total de uma compra e o número de parcelas. O programa deverá informar o valor da parcela

    //Entrada
        var total = prompt("Informe o valor total");
        var parcelas = prompt("Informe o número de parcelas");
        var prestacao = parseFloat(total) / parseInt(parcelas);
        //Saída
        alert("O valor da parcela é: " + prestacao);
    </script>
</body>
</html>
